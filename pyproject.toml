[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waagenspiel"
version = "1.0.0"
description = "Exakte Erzeugung irredundanter Relationssysteme fuer vier Gewichte"
requires-python = ">=3.10"
dependencies = ["z3-solver>=4.12,<6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
